[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luna-simple"
version = "0.4.0"
description = "Luna — простой лёгкий CLI-агент для кода на собственном ядре luna-core. Observe, Understand, Plan, Act."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luna contributors" }]
keywords = ["cli", "coding-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "luna-core",
    "rich>=13.7",
    "questionary>=2.1",
    "httpx>=0.27",
    "starlette>=1.6",
    "sse-starlette>=3.0",
    "uvicorn>=0.30",
    "textual>=8.2",
]

[project.optional-dependencies]
mcp = ["luna-core[mcp]"]
acp = ["luna-core[acp]"]
lsp = ["multilspy>=0.0.15"]
websearch = ["ddgs>=8.0"]
all = ["luna-simple[mcp,acp,lsp,websearch]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mcp>=1.12,<2", "agent-client-protocol>=0.4"]

[project.scripts]
luna = "luna.cli:main"
luna-simple = "luna.cli:main"

[project.urls]
Homepage = "https://github.com/Dushe4ka/luna-simple"
Repository = "https://github.com/Dushe4ka/luna-simple"

[tool.uv.workspace]
members = ["packages/luna-core"]

[tool.uv.sources]
luna-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["luna"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/luna-core/tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls real provider APIs (needs keys)"]
asyncio_mode = "auto"

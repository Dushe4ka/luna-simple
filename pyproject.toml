[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luna-simple"
version = "0.3.0"
description = "Luna — простой лёгкий CLI-агент для кода на deepagents. Observe, Understand, Plan, Act."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luna contributors" }]
keywords = ["cli", "coding-agent", "llm", "deepagents", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "deepagents~=0.7.13",
    "langchain~=1.4",
    "langgraph~=1.2",
    "rich>=13.7",
    "langchain-anthropic>=1.7",
    "langgraph-checkpoint-sqlite>=2.0",
    "questionary>=2.1",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "starlette>=1.6",
    "sse-starlette>=3.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek>=0.1"]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]
ollama = ["langchain-ollama>=1.0"]
mistral = ["langchain-mistralai>=1.0"]
xai = ["langchain-xai>=1.0"]
groq = ["langchain-groq>=1.0"]
fireworks = ["langchain-fireworks>=1.0"]
together = ["langchain-together>=0.1"]
openrouter = ["langchain-openrouter>=0.1"]
perplexity = ["langchain-perplexity>=1.0"]
mcp = ["langchain-mcp-adapters>=0.3"]
lsp = ["multilspy>=0.0.15"]
all = [
    "langchain-deepseek>=0.1",
    "langchain-openai>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-ollama>=1.0",
    "langchain-mistralai>=1.0",
    "langchain-xai>=1.0",
    "langchain-groq>=1.0",
    "langchain-fireworks>=1.0",
    # langchain-together intentionally omitted: no published version is
    # compatible with both langchain-openai>=1.0 and multilspy's pinned
    # requests==2.32.3 in the same resolved environment. Install the
    # `together` extra separately if you need it: pip install "luna-simple[together]"
    "langchain-openrouter>=0.1",
    "langchain-perplexity>=1.0",
    "langchain-mcp-adapters>=0.3",
    "multilspy>=0.0.15",
]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
luna = "luna.cli:main"
luna-simple = "luna.cli:main"

[project.urls]
Homepage = "https://github.com/Dushe4ka/luna-simple"
Repository = "https://github.com/Dushe4ka/luna-simple"

[tool.uv]
conflicts = [
    [
      { extra = "together" },
      { extra = "openai" },
    ],
    [
      { extra = "together" },
      { extra = "lsp" },
    ],
    [
      { extra = "together" },
      { extra = "all" },
    ],
]

[tool.hatch.build.targets.wheel]
packages = ["luna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luna-simple"
version = "0.1.0"
description = "Luna - a simple, lightweight CLI coding agent. Observe, Understand, Plan, Act."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luna contributors" }]
keywords = ["cli", "coding-agent", "llm", "deepagents", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "deepagents~=0.7.13",
    "langchain~=1.4",
    "langgraph~=1.2",
    "rich>=13.7",
    "langchain-anthropic>=1.7",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek>=0.1"]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]
ollama = ["langchain-ollama>=1.0"]
mcp = ["langchain-mcp-adapters>=0.3"]
all = [
    "langchain-deepseek>=0.1",
    "langchain-openai>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-ollama>=1.0",
    "langchain-mcp-adapters>=0.3",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
luna = "luna.cli:main"
luna-simple = "luna.cli:main"

[project.urls]
Homepage = "https://github.com/earendil-works/pi"
Repository = "https://github.com/earendil-works/pi"

[tool.hatch.build.targets.wheel]
packages = ["luna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

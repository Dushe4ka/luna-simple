[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luna-core"
version = "0.1.0"
description = "Luna agent runtime and SDK: own agent loop, tools, event-log sessions and provider adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luna contributors" }]
dependencies = ["httpx>=0.27", "httpx-sse>=0.4", "pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
acp = ["agent-client-protocol>=0.4"]
lsp = ["multilspy>=0.0.15"]
websearch = ["ddgs>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/luna_core"]
